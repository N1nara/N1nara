<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bagagem | N1nara</title>
  <meta name="description" content="Página de identificação para bagagem, mala, mochila ou objeto com WhatsApp e localização.">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body id="top">
  <div data-header></div>

  <main class="page">
    <div class="section-inner two-column">
      <div>
        <img class="profile-photo" src="images/produto-placeholder.svg" alt="Imagem de bagagem identificada">
        <div class="qr-box">
          <strong>QR Code</strong>
          <img data-qrcode alt="QR Code da página da bagagem">
          <span class="muted">Escaneie para abrir esta página.</span>
        </div>
      </div>
      <div>
        <h1 class="page-title">Identificação de bagagem</h1>
        <p class="page-lead">Modelo de página para quem encontrou uma mala, mochila ou objeto identificado.</p>
        <div class="info-list">
          <div class="info-row"><strong>Nome</strong>Nome do proprietário</div>
          <div class="info-row"><strong>Telefone</strong><a href="https://wa.me/5521984004976" target="_blank" rel="noopener">WhatsApp</a></div>
          <div class="info-row"><strong>WhatsApp</strong><a href="https://wa.me/5521984004976" target="_blank" rel="noopener">Enviar mensagem</a></div>
        </div>
        <div class="actions">
          <button class="button green" data-share-location="bagagem">Compartilhar minha localização</button>
          <a class="button secondary" href="https://wa.me/5521984004976" target="_blank" rel="noopener">Falar com o proprietário</a>
        </div>
      </div>
    </div>
  </main>

  <div data-footer></div>
  <script src="assets/js/main.js"></script>
  <script src="assets/js/location.js"></script>
</body>
</html>
